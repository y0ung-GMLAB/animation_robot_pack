# 닭 오브제 · 직렬 서보 4개 · 애니메이션 값 = 모터 출력축 각도(쉬는 자세 대비 · Blender 크랭크 본 각도) · 감속기 없음
# 축 순서 = 옛 컨트롤러 번호 0..3 · head_yaw FEETECH (TTL · FE-URT-2) · crank_l · crank_r · crank_f XM430-W350-R (RS-485 · U2D2)
# range_deg · 조종 본 리밋(Neck_Base X −15.5..24 · Neck X −26..14 · Z ±29.5 · Head_Yaw Z −27..37) 안에서 크랭크가 실제로 닿는 범위
#   (composition5 사용 범위 · L −2.6..16.6 · R −18.6..−0.7 · F −28.3..39.1 · 머리 −26.6..36.8)
# drive · 모터 출력축 · XM430-W350 무부하 46 rpm (12 V) = 276 °/s · 가속은 다이나믹셀 기본(제한 없음) 대신 큰 값
# servo_bw_hz · 다이나믹셀 위치 제어 기본 게인 기준 추정
axes:
  - {joint: head_yaw, motion_id: "head_yaw", motor: FEETECH_HEAD_YAW, reducer: null, ratio: 1, range_deg: [-27, 37], servo_bw_hz: 8}
  - {joint: crank_l,  motion_id: "crank_l",  motor: XM430-W350-R,     reducer: null, ratio: 1, range_deg: [-8.5, 49.2], servo_bw_hz: 8}
  - {joint: crank_r,  motion_id: "crank_r",  motor: XM430-W350-R,     reducer: null, ratio: 1, range_deg: [-49.2, 8.5], servo_bw_hz: 8}
  - {joint: crank_f,  motion_id: "crank_f",  motor: XM430-W350-R,     reducer: null, ratio: 1, range_deg: [-71.0, 40.2], servo_bw_hz: 8}
drive: {profile_velocity_deg_s: 276, profile_accel_deg_s2: 10000}
env:
  settle_body: base      # 고정 베이스 (free joint 없음 → 정착 감쇠 생략)
  settle_s: 1
  torsion_k: 0
  torsion_c: 0
  camera: {lookat: [0.0, -0.11, 0.1], distance: 0.9, azimuth: 120, elevation: -15}
