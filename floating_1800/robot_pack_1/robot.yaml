# 플로팅 헤드 1800 · 헤드 1 (motion_id 1-1..1-5 · 애니메이션 파일 id 와 동일)
# 축 · 제어기함 pptx slide4 (slave 0..4 순서) · 모델 · floating_1800/sim/fh_1800_wires_R011.xml
# drive · 플로팅 PC 모터 설정 = 플랫폼 기본값 (사용자 확인 2026-10-02) · 모터축 deg/s, deg/s²
axes:
  - {joint: neck_pitch, motion_id: "1-1", motor: MSMF082L1T2, reducer: KHY-90-2-RV, ratio: 150, range_deg: [-10, 13], servo_bw_hz: 5}
  - {joint: neck_yaw,   motion_id: "1-2", motor: MSMF082L1T2, reducer: KSD-90-2,    ratio: 100, range_deg: [-15, 15], servo_bw_hz: 5}
  - {joint: eye_pitch,  motion_id: "1-3", motor: MSMF011L1,   reducer: KHY55-R44V,  ratio: 50,  range_deg: [-10, 10], servo_bw_hz: 12}
  - {joint: eye_yaw_l,  motion_id: "1-4", motor: MSMF5AZL1,   reducer: PGX44-H,     ratio: 35,  range_deg: [-12, 12], servo_bw_hz: 12}
  - {joint: eye_yaw_r,  motion_id: "1-5", motor: MSMF5AZL1,   reducer: PGX44-H,     ratio: 35,  range_deg: [-12, 12], servo_bw_hz: 12}
drive: {profile_velocity_deg_s: 18000, profile_accel_deg_s2: 180000}
env:
  settle_body: base
  settle_s: 10
  torsion_k: 500
  torsion_c: 150
  camera: {lookat: [0.0, -0.2, 3.5], distance: 5.5, azimuth: -60, elevation: -5}
